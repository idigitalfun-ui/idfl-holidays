<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDFL — My Holidays</title>
<style>body{font:15px system-ui;background:#f4f7fc;color:#15233b;margin:0;padding:18px}main{max-width:800px;margin:auto}.panel{background:white;border:1px solid #d8e1ed;border-radius:14px;padding:20px;margin:14px 0}h1{font-size:24px}input,select,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #a9b8cb}input{width:100%;box-sizing:border-box}button{background:#1d4ed8;color:white;cursor:pointer}.muted{color:#56657b;font-size:13px}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #e1e6ed;text-align:left}.num{text-align:right}#dashboard{display:none}</style>
</head><body><main><section class="panel"><h1>IDFL — My Holidays</h1><p class="muted">Private, read-only employee view. Only your manager can change records.</p></section>
<section class="panel" id="signin"><h2>Sign in</h2><p class="muted">Use the email address authorised by your manager. We will email you a secure sign-in link.</p><form id="form"><input type="email" id="email" required autocomplete="email" placeholder="Your email"><button type="submit">Email sign-in link</button></form><p id="message" role="status"></p></section>
<div id="dashboard"><section class="panel"><button style="float:right" id="signout">Sign out</button><h2 id="staffname"></h2><p class="muted" id="shop"></p><label>Period <select id="period"><option value="2026">2026</option><option value="2025">2025</option><option value="2024">2024</option><option value="pre2024">Before 2024</option></select></label><p id="warning" class="muted"></p></section>
<section class="panel"><table><tbody id="facts"></tbody></table></section>
<section class="panel"><h2 id="entriesTitle">Recorded holidays</h2><table><thead><tr><th>Date / period</th><th class="num">Hours</th><th>Notes</th></tr></thead><tbody id="entries"></tbody></table></section></div>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.86.0/dist/umd/supabase.min.js"></script><script src="./supabase-config.js"></script>
<script>
(() => {
 const cfg=window.IDFL_SUPABASE_CONFIG;
 const api=window.supabase.createClient(cfg.url,cfg.publishableKey);
 const el=id=>document.getElementById(id), put=(id,value)=>el(id).textContent=String(value??''), fmt=n=>Number(n||0).toFixed(2);
 let record=null;
 const cell=(row,txt,tag)=>{let d=document.createElement(tag||'td');d.textContent=String(txt??'');row.appendChild(d);return d};
 function addFact(k,v){const tr=document.createElement('tr');cell(tr,k);cell(tr,v);el('facts').appendChild(tr)}
 function addEntry(a,b,c){let tr=document.createElement('tr');cell(tr,a);cell(tr,b);cell(tr,c);el('entries').appendChild(tr)}
 function render(){
  const p=record.profile||{},year=el('period').value;
  put('staffname',p.name||'Employee');put('shop',p.shop||'');el('facts').replaceChildren();el('entries').replaceChildren();
  if(year==='pre2024'){
   put('entriesTitle','2023 working records');
   const h=record.pre2024;
   put('warning','Older figures are historical source evidence, not confirmed annual leave entitlement or automatic 2024 carry-over.');
   if(!h){addFact('Historical record','No verified historical record available.');return;}
   addFact('Source',h.source);addFact('As of',h.asOfDate);addFact('Reported available hours',h.availableAtDateHours==null?'Not recorded':fmt(h.availableAtDateHours)+' hours');
   for(const w of h.workedWeeks2023||[])addEntry(w.weekStart,fmt(w.workedHours),'Recorded worked hours');
   return;
  }
  put('entriesTitle','Holidays recorded in '+year);
  const y=(record.years||{})[year]||{},weeks=y.weeks||[],holiday=(record.holLogs||[]).filter(x=>String(x.year)===year);
  const worked=weeks.reduce((s,x)=>s+Number(x.hours||0),0),taken=holiday.reduce((s,x)=>s+Number(x.hours||0),0);
  put('warning','Figures reflect recorded inputs, not a final payroll or statutory entitlement verification. If your balance differs, ask your manager to review.');
  addFact('Recorded opening',fmt(y.opening)+' hours');addFact('Recorded worked hours',fmt(worked)+' hours');addFact('8% accrual (illustrative)',fmt(worked*.08)+' hours');addFact('Recorded holidays taken',fmt(taken)+' hours');
  addFact('Bank holiday inclusion setting',(record.bankHolidayInclusions||{})[year]?'Included':'Not included');
  for(const a of holiday)addEntry(a.date,fmt(a.hours),a.note||'');
  if(!holiday.length)addEntry('No holiday entries recorded','','');
 }
 async function load(){
  let {data:{session},error:sessionError}=await api.auth.getSession();if(sessionError)throw sessionError;
  if(!session){el('signin').style.display='block';el('dashboard').style.display='none';return;}
  const {data,error}=await api.rpc('portal_my_record');if(error)throw error;
  if(!data){put('message','Your email has not yet been assigned to an employee by your manager.');el('signin').style.display='block';el('dashboard').style.display='none';return;}
  record=data;el('signin').style.display='none';el('dashboard').style.display='block';render();
 }
 el('period').addEventListener('change',render);
 el('form').addEventListener('submit',async e=>{e.preventDefault();put('message','Sending sign-in link...');const {error}=await api.auth.signInWithOtp({email:el('email').value.trim(),options:{emailRedirectTo:new URL('staff.html',location.href).href}});put('message',error?error.message:'Check your inbox for the secure sign-in link.');});
 el('signout').addEventListener('click',async()=>{await api.auth.signOut();record=null;await load()});
 api.auth.onAuthStateChange(()=>{setTimeout(()=>load().catch(e=>put('message',e.message)),0)});
 load().catch(e=>put('message',e.message));
})();
</script></body></html>
