<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDFL Holidays</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0e17;--sf:#141726;--sf2:#1b1f33;--sf3:#222740;--bd:#2d334d;--bd2:#464f7a;
  --tx:#edf0ff;--tx2:#a1adcf;--tx3:#636c91;
  --ac:#5b8ef5;--ac2:rgba(91,142,245,.14);--acg:rgba(91,142,245,.22);
  --gr:#4ade80;--gr2:rgba(74,222,128,.11);
  --rd:#f87171;--rd2:rgba(248,113,113,.12);
  --am:#fbbf24;--am2:rgba(251,191,36,.11);
  --pu:#a78bfa;--pu2:rgba(167,139,250,.11);
  --pk:#f472b6;--pk2:rgba(244,114,182,.12);
  --shadow:0 4px 24px rgba(0,0,0,.45);--shadowL:0 20px 60px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--tx);height:100vh;overflow:hidden;display:flex;flex-direction:column;font-size:14px}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
header{background:var(--sf);border-bottom:1px solid var(--bd);padding:11px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0;box-shadow:var(--shadow);z-index:20;flex-wrap:wrap}
.logo{font-weight:900;font-size:1.15rem;letter-spacing:-.5px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.logo-mark{width:28px;height:28px;background:linear-gradient(135deg,var(--ac),#8ab0ff);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.72rem;color:#fff;font-weight:900;flex-shrink:0}
.logo em{color:var(--ac);font-style:normal}
.year-tabs{display:flex;background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:3px;gap:2px}
.year-tab{font-family:'Outfit',sans-serif;font-size:.78rem;font-weight:700;padding:6px 16px;border-radius:7px;border:none;background:none;color:var(--tx3);cursor:pointer;transition:all .15s}
.year-tab:hover{color:var(--tx)}
.year-tab.active{background:var(--ac);color:#fff}
.hdr-search{flex:1;max-width:240px;position:relative}
.hdr-search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--bd);border-radius:9px;background:var(--sf2);color:var(--tx);font-family:'Outfit',sans-serif;font-size:.79rem;outline:none;transition:border-color .15s}
.hdr-search input:focus{border-color:var(--ac)}
.hdr-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.4;pointer-events:none}
.hdr-stats{display:flex;gap:18px;font-size:.72rem;color:var(--tx3)}
.hdr-stats strong{color:var(--tx);font-weight:800}
.btn{font-family:'Outfit',sans-serif;font-size:.73rem;font-weight:700;padding:6px 12px;border-radius:7px;border:none;cursor:pointer;transition:all .15s}
.btn-ac{background:var(--ac);color:#fff}.btn-ac:hover{filter:brightness(1.12)}
.btn-rd{background:var(--rd2);color:var(--rd);border:1px solid var(--rd)}.btn-rd:hover{background:var(--rd);color:#fff}
.btn-am{background:var(--am2);color:var(--am);border:1px solid var(--am)}.btn-am:hover{background:var(--am);color:#000}
.btn-gr{background:var(--gr2);color:var(--gr);border:1px solid var(--gr)}.btn-gr:hover{background:var(--gr);color:#000}
.btn-ghost{background:var(--sf2);color:var(--tx2);border:1px solid var(--bd)}.btn-ghost:hover{border-color:var(--bd2);color:var(--tx)}
.btn-pk{background:var(--pk2);color:var(--pk);border:1px solid var(--pk)}.btn-pk:hover{background:var(--pk);color:#fff}
.btn-pu{background:var(--pu2);color:var(--pu);border:1px solid var(--pu)}.btn-pu:hover{background:var(--pu);color:#fff}
.body{flex:1;display:flex;min-height:0}
.sidebar{width:265px;flex-shrink:0;background:var(--sf);border-right:1px solid var(--bd);overflow-y:auto;padding:10px 0}
.grp-hd{font-size:.63rem;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);padding:12px 16px 6px}
.grp-hd:first-child{padding-top:4px}
.staff-item{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer;transition:background .12s;border-left:3px solid transparent}
.staff-item:hover{background:var(--sf2)}
.staff-item.active{background:var(--ac2);border-left-color:var(--ac)}
.staff-item.active .si-name{color:var(--ac)}
.si-avatar{width:30px;height:30px;border-radius:50%;background:var(--sf3);color:var(--tx2);font-size:.68rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.si-info{flex:1;min-width:0}
.si-name{font-weight:700;font-size:.81rem;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si-sub{font-size:.63rem;color:var(--tx3);margin-top:1px}
.si-badge{font-size:.62rem;font-weight:800;padding:2px 7px;border-radius:9px;flex-shrink:0;font-family:'JetBrains Mono',monospace}
.si-badge.pos{background:var(--gr2);color:var(--gr)}
.si-badge.neg{background:var(--rd2);color:var(--rd)}
.si-badge.zero{background:var(--sf3);color:var(--tx3)}
.main{flex:1;min-width:0;overflow-y:auto;padding:20px 24px}
.empty-state{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--tx3);gap:8px;text-align:center}
.empty-state .es-icon{font-size:2.4rem;opacity:.5;margin-bottom:6px}
.empty-state .es-title{font-size:1rem;font-weight:700;color:var(--tx2)}
.profile-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.profile-name{font-size:1.4rem;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grp-tag{font-size:.63rem;font-weight:800;padding:3px 10px;border-radius:20px;border:1px solid;vertical-align:middle}
.g1-tag{background:var(--ac2);color:var(--ac);border-color:var(--ac)}
.g2-tag{background:var(--am2);color:var(--am);border-color:var(--am)}
.g3-tag{background:var(--pu2);color:var(--pu);border-color:var(--pu)}
.start-row{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:.78rem;color:var(--tx2);flex-wrap:wrap}
.tenure{color:var(--tx3)}
.start-edit-btn{font-size:.68rem;color:var(--ac);cursor:pointer;background:none;border:none;font-family:'Outfit',sans-serif;font-weight:700;padding:2px 6px;border-radius:5px;transition:background .12s}
.start-edit-btn:hover{background:var(--ac2)}
.start-input{background:var(--sf2);border:1px solid var(--ac);border-radius:6px;color:var(--tx);font-family:'Outfit',sans-serif;font-size:.78rem;padding:3px 7px;outline:none}
.profile-actions{display:flex;gap:8px;flex-wrap:wrap}
.grid3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:16px;align-items:start}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}
@media(max-width:1100px){.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:800px){.grid3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card-hd{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-hd h3{font-size:.84rem;font-weight:800}
.card-sub{font-size:.68rem;color:var(--tx3)}
.weeks-wrap{max-height:460px;overflow-y:auto}
table.weeks{width:100%;border-collapse:collapse;font-size:.76rem}
table.weeks thead th{position:sticky;top:0;background:var(--sf2);color:var(--tx2);font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:7px 14px;text-align:left;border-bottom:1px solid var(--bd);z-index:2}
table.weeks thead th.num{text-align:right}
table.weeks tbody td{padding:7px 14px;border-bottom:1px solid var(--bd)}
table.weeks tbody tr:last-child td{border-bottom:none}
table.weeks tbody tr:hover td{background:var(--sf2)}
table.weeks td.num{text-align:right;font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--ac)}
table.weeks td.wk{color:var(--tx3);font-size:.66rem;width:44px}
table.weeks td.act{text-align:right;width:60px}
.edit-hrs-inp{width:56px;background:var(--sf2);border:1px solid var(--ac);border-radius:5px;color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:.76rem;padding:2px 5px;outline:none;text-align:right}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--tx3);padding:2px 4px;border-radius:4px;font-size:.8rem;line-height:1;transition:all .12s}
.icon-btn:hover{background:var(--sf3);color:var(--tx)}
.add-week-form{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--bd);flex-wrap:wrap;background:var(--sf2)}
.add-week-form input{background:var(--sf);border:1px solid var(--bd);border-radius:7px;color:var(--tx);font-family:'Outfit',sans-serif;font-size:.73rem;padding:5px 8px;outline:none}
.add-week-form input:focus{border-color:var(--ac)}
.add-week-form input.lbl{flex:2;min-width:140px}
.add-week-form input.hrs{width:64px}
.stat-block{padding:16px}
.stat-hero{text-align:center;padding:6px 0 14px}
.stat-hero .sh-hrs{font-size:2.5rem;font-weight:900;line-height:1;letter-spacing:-1px}
.stat-hero .sh-days{font-size:.82rem;font-weight:700;margin-top:4px;opacity:.75}
.stat-hero .sh-lbl{font-size:.68rem;color:var(--tx3);margin-top:3px;font-weight:600}
.stat-rows{display:flex;flex-direction:column;border-top:1px solid var(--bd)}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;border-bottom:1px solid var(--bd);font-size:.77rem}
.stat-row:last-child{border-bottom:none}
.stat-row .sr-lbl{color:var(--tx2)}
.stat-row .sr-val{font-family:'JetBrains Mono',monospace;font-weight:700}
.sr-val.am{color:var(--am)}.sr-val.gr{color:var(--gr)}.sr-val.tx{color:var(--tx)}.sr-val.ac{color:var(--ac)}.sr-val.rd{color:var(--rd)}.sr-val.pk{color:var(--pk)}
.log-list{max-height:200px;overflow-y:auto}
.log-item{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--bd);font-size:.74rem}
.log-item:last-child{border-bottom:none}
.log-date{font-family:'JetBrains Mono',monospace;color:var(--tx2);min-width:80px;flex-shrink:0;font-size:.7rem}
.log-note{flex:1;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-hrs{font-weight:700;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.log-hrs.hol{color:var(--am)}.log-hrs.sick{color:var(--pk)}
.log-del{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:.82rem;padding:2px 4px;border-radius:4px;transition:all .12s}
.log-del:hover{color:var(--rd);background:var(--rd2)}
.log-empty{padding:20px 16px;text-align:center;color:var(--tx3);font-size:.74rem}
.add-log-form{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--bd);flex-wrap:wrap;background:var(--sf2)}
.add-log-form input{background:var(--sf);border:1px solid var(--bd);border-radius:7px;color:var(--tx);font-family:'Outfit',sans-serif;font-size:.73rem;padding:5px 8px;outline:none}
.add-log-form input:focus{border-color:var(--ac)}
.add-log-form input[type=date]{flex:1;min-width:110px}
.add-log-form input[type=number]{width:60px}
.add-log-form input[type=text]{flex:2;min-width:90px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-bg.hidden{display:none}
.modal{background:var(--sf);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--shadowL);width:100%;max-width:480px;max-height:80vh;overflow-y:auto}
.modal-hd{padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.modal-hd h2{font-size:.95rem;font-weight:800}
.modal-close{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:1.1rem;padding:2px 6px;border-radius:5px}
.modal-close:hover{color:var(--tx);background:var(--sf2)}
.modal-body{padding:20px}
.modal-body label{display:block;font-size:.74rem;color:var(--tx2);margin-bottom:5px;font-weight:700}
.modal-body input,.modal-body textarea{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-family:'Outfit',sans-serif;font-size:.8rem;padding:8px 10px;outline:none;margin-bottom:14px}
.modal-body input:focus,.modal-body textarea:focus{border-color:var(--ac)}
.modal-footer{padding:14px 20px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px}
.share-output{background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:12px;font-family:'JetBrains Mono',monospace;font-size:.72rem;line-height:1.6;color:var(--tx2);white-space:pre-wrap;max-height:340px;overflow-y:auto;margin-bottom:12px}
.toast{position:fixed;bottom:16px;right:16px;z-index:999;padding:10px 16px;border-radius:9px;font-weight:700;font-size:.75rem;background:var(--gr);color:#071a0c;box-shadow:var(--shadowL);animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.sick-bar-wrap{padding:12px 16px 4px;border-top:1px solid var(--bd)}
.sick-bar-label{display:flex;justify-content:space-between;font-size:.7rem;color:var(--tx3);margin-bottom:6px}
.sick-bar-track{background:var(--sf3);border-radius:4px;height:6px;overflow:hidden}
.sick-bar-fill{height:100%;border-radius:4px;background:var(--pk);transition:width .3s}
.sick-bar-fill.over{background:var(--rd)}
.menu-btn{display:none;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);width:34px;height:34px;border-radius:8px;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
@media(max-width:700px){
  .sidebar{position:fixed;left:0;top:57px;bottom:0;z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadowL)}
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:flex!important}
  header{flex-wrap:wrap}
  .main{padding:14px}
}
</style>
</head>
<body>

<header>
  <button class="menu-btn" id="menuBtn">&#9776;</button>
  <div class="logo"><div class="logo-mark">IF</div>IDFL <em>Holidays</em></div>
  <div class="year-tabs" id="yearTabs"></div>
  <div class="hdr-search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchBox" placeholder="Search staff&hellip;">
  </div>
  <div class="hdr-stats" id="hdrStats"></div>
  <button class="btn btn-am" id="bulkHolBtn" style="margin-left:auto">&#43; Holiday For All</button>
</header>

<div class="body">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>

<!-- Bulk Holiday Modal -->
<div class="modal-bg hidden" id="bulkModal">
  <div class="modal">
    <div class="modal-hd"><h2>&#43; Add Holiday for All Staff</h2><button class="modal-close" id="bulkClose">&times;</button></div>
    <div class="modal-body">
      <label>Date</label>
      <input type="date" id="bulkDate">
      <label>Hours</label>
      <input type="number" id="bulkHrs" min="0" step="0.5" placeholder="e.g. 7">
      <label>Note / Description</label>
      <input type="text" id="bulkNote" placeholder="e.g. Bank Holiday">
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="bulkCancelBtn">Cancel</button>
      <button class="btn btn-am" id="bulkSaveBtn">Add to All Staff</button>
    </div>
  </div>
</div>

<!-- Share Modal -->
<div class="modal-bg hidden" id="shareModal">
  <div class="modal">
    <div class="modal-hd"><h2>&#128279; Share Summary</h2><button class="modal-close" id="shareClose">&times;</button></div>
    <div class="modal-body">
      <div class="share-output" id="shareOutput"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="shareCloseBtn">Close</button>
      <button class="btn btn-ac" id="shareCopyBtn">&#128203; Copy to Clipboard</button>
    </div>
  </div>
</div>

<script>
const SICK_ALLOWANCE_HRS = 35;
const LS_KEY = 'idfl-ov2';
const BASE = JSON.parse(document.getElementById('holiday-data').textContent);
function loadOv(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||'{}'); }catch(e){ return {}; } }
function saveOv(o){ localStorage.setItem(LS_KEY, JSON.stringify(o)); }
let ov = loadOv();
let activeSid = null;
let activeYear = null;
const years = Object.keys(BASE.years).sort();
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function fmt1(n){ return (Math.round((+n||0)*10)/10).toFixed(1); }
function fmtDays(h){ return fmt1(h/5); }
function initials(n){ return n.split(' ').map(function(p){return p[0];}).join('').toUpperCase().slice(0,2); }
function avatarColor(sid){
  const palette=['#5b8ef5','#4ade80','#fbbf24','#a78bfa','#f472b6','#f87171'];
  const i=parseInt(sid.replace('s',''),10)-1;
  return palette[i%palette.length];
}
function toast(msg,col){
  col=col||'var(--gr)';
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  t.style.background=col;t.style.color=(col==='var(--gr)'||col==="#4ade80")?'#071a0c':'#fff';
  document.body.appendChild(t);setTimeout(function(){t.remove();},2400);
}
function getStaffBase(sid,year){ return ((BASE.years[year]||{})[sid])||null; }
function getWeeks(sid,year){
  const ovEntry=((ov[year]||{})[sid])||{};
  if(ovEntry.weeks) return ovEntry.weeks;
  const base=getStaffBase(sid,year);
  return base?base.weeks:[];
}
function getOpening(sid,year){
  const ovEntry=((ov[year]||{})[sid])||{};
  if(ovEntry.opening!==undefined) return ovEntry.opening;
  const base=getStaffBase(sid,year);
  return base?base.opening:null;
}
function calcHolidays(sid,year){
  const weeks=getWeeks(sid,year);
  if(!weeks||!weeks.length) return 0;
  return Math.round(weeks.reduce(function(s,w){return s+(w.hours||0);},0)*0.08*100)/100;
}
function getHolLog(sid){ return ((ov._holLog||{})[sid])||[]; }
function getSickLog(sid){ return ((ov._sickLog||{})[sid])||[]; }
function holTakenForYear(sid,year){
  return getHolLog(sid).filter(function(e){return e.year===year;}).reduce(function(s,e){return s+(e.hours||0);},0);
}
function sickUsedForYear(sid,year){
  return getSickLog(sid).filter(function(e){return e.year===year;}).reduce(function(s,e){return s+(e.hours||0);},0);
}
function computeBalance(sid,year){
  const opening=getOpening(sid,year)||0;
  const earned=calcHolidays(sid,year);
  const taken=holTakenForYear(sid,year);
  return opening+earned-taken;
}
function ensureOvYear(year,sid){
  if(!ov[year]) ov[year]={};
  if(!ov[year][sid]) ov[year][sid]={};
}
function setWeekHours(sid,year,idx,hours){
  ensureOvYear(year,sid);
  const weeks=JSON.parse(JSON.stringify(getWeeks(sid,year)));
  weeks[idx].hours=hours;
  ov[year][sid].weeks=weeks;
  saveOv(ov);
}
function addWeek(sid,year,label,hours){
  ensureOvYear(year,sid);
  const weeks=JSON.parse(JSON.stringify(getWeeks(sid,year)));
  weeks.push({label:label,hours:hours});
  ov[year][sid].weeks=weeks;
  saveOv(ov);
}
function addHolEntry(sid,year,date,hours,note){
  if(!ov._holLog) ov._holLog={};
  if(!ov._holLog[sid]) ov._holLog[sid]=[];
  ov._holLog[sid].push({id:uid(),year:year,date:date,hours:hours,note:note});
  saveOv(ov);
}
function delHolEntry(sid,id){
  if(!ov._holLog||!ov._holLog[sid]) return;
  ov._holLog[sid]=ov._holLog[sid].filter(function(e){return e.id!==id;});
  saveOv(ov);
}
function addSickEntry(sid,year,date,hours,note){
  if(!ov._sickLog) ov._sickLog={};
  if(!ov._sickLog[sid]) ov._sickLog[sid]=[];
  ov._sickLog[sid].push({id:uid(),year:year,date:date,hours:hours,note:note});
  saveOv(ov);
}
function delSickEntry(sid,id){
  if(!ov._sickLog||!ov._sickLog[sid]) return;
  ov._sickLog[sid]=ov._sickLog[sid].filter(function(e){return e.id!==id;});
  saveOv(ov);
}
function renderYearTabs(){
  const el=document.getElementById('yearTabs');
  el.innerHTML=years.map(function(y){return '<button class="year-tab'+(y===activeYear?' active':'')+'" data-y="'+y+'">'+y+'</button>';}).join('');
  el.querySelectorAll('.year-tab').forEach(function(b){b.addEventListener('click',function(){activeYear=b.dataset.y;renderAll();});});
}
function renderHdrStats(){
  const el=document.getElementById('hdrStats');
  if(!activeYear){el.innerHTML='';return;}
  let n=0,tot=0;
  BASE.staff.forEach(function(s){
    const b=getStaffBase(s.id,activeYear);
    if(b||getWeeks(s.id,activeYear).length){n++;tot+=computeBalance(s.id,activeYear);}
  });
  el.innerHTML='<span>Staff with data: <strong>'+n+'</strong></span><span>Total balance: <strong>'+fmt1(tot)+' hrs</strong></span>';
}
function renderSidebar(){
  const el=document.getElementById('sidebar');
  const q=(document.getElementById('searchBox').value||'').toLowerCase();
  const groups={1:[],2:[],3:[]};
  BASE.staff.forEach(function(s){
    if(q&&!s.name.toLowerCase().includes(q)) return;
    const balance=computeBalance(s.id,activeYear);
    const hasData=!!(getStaffBase(s.id,activeYear)||getWeeks(s.id,activeYear).length);
    let badgeCls='zero',badgeTxt='-';
    if(hasData){
      if(balance>0){badgeCls='pos';badgeTxt=fmt1(balance)+'h';}
      else if(balance<0){badgeCls='neg';badgeTxt=fmt1(balance)+'h';}
      else{badgeCls='zero';badgeTxt='0.0h';}
    }
    const div=document.createElement('div');
    div.className='staff-item'+(s.id===activeSid?' active':'');
    div.innerHTML='<div class="si-avatar" style="background:'+avatarColor(s.id)+';color:#0c0e17">'+initials(s.name)+'</div>'
      +'<div class="si-info"><div class="si-name">'+s.name+'</div><div class="si-sub">'+(s.role||'')+'</div></div>'
      +(hasData?'<span class="si-badge '+badgeCls+'">'+badgeTxt+'</span>':'');
    div.addEventListener('click',function(){activeSid=s.id;renderAll();});
    groups[s.group||1].push(div);
  });
  el.innerHTML='';
  const gNames={1:'IDFL Belfast',2:'IDFL Sligo',3:'IDFL Remote'};
  [1,2,3].forEach(function(g){
    if(!groups[g].length) return;
    const hd=document.createElement('div');hd.className='grp-hd';hd.textContent=gNames[g];
    el.appendChild(hd);
    groups[g].forEach(function(d){el.appendChild(d);});
  });
}
function renderMain(){
  const el=document.getElementById('main');
  if(!activeSid){
    el.innerHTML='<div class="empty-state"><div class="es-icon">&#128197;</div><div class="es-title">Select a staff member</div><div style="font-size:.8rem;color:var(--tx3);margin-top:4px">Choose from the sidebar to view holiday details</div></div>';
    return;
  }
  const staff=BASE.staff.find(function(s){return s.id===activeSid;});
  if(!staff){el.innerHTML='';return;}
  const gTag=['','g1-tag','g2-tag','g3-tag'][staff.group||1];
  const gName=['','IDFL Belfast','IDFL Sligo','IDFL Remote'][staff.group||1];
  const weeks=getWeeks(activeSid,activeYear);
  const totalWorked=weeks.reduce(function(s,w){return s+(w.hours||0);},0);
  const earned=calcHolidays(activeSid,activeYear);
  const opening=getOpening(activeSid,activeYear)||0;
  const holTaken=holTakenForYear(activeSid,activeYear);
  const balance=opening+earned-holTaken;
  const sickUsed=sickUsedForYear(activeSid,activeYear);
  const sickRemaining=SICK_ALLOWANCE_HRS-sickUsed;
  const sickPct=Math.min(100,Math.round(sickUsed/SICK_ALLOWANCE_HRS*100));
  const holLog=getHolLog(activeSid).filter(function(e){return e.year===activeYear;});
  const sickLog=getSickLog(activeSid).filter(function(e){return e.year===activeYear;});
  let balColor='var(--gr)';
  if(balance<0) balColor='var(--rd)';
  else if(balance<14) balColor='var(--am)';
  el.innerHTML=
    '<div class="profile-hd">'
    +'<div><div class="profile-name">'+staff.name+' <span class="grp-tag '+gTag+'">'+gName+'</span></div>'
    +'<div class="start-row">Started: <strong id="startDisplay">'+(staff.startDate||'<em style="color:var(--am)">Not set</em>')+'</strong>'
    +' <button class="start-edit-btn" id="startEditBtn">Edit</button></div></div>'
    +'<div class="profile-actions"><button class="btn btn-pu" id="shareBtn">&#128279; Share</button></div></div>'
    +'<div class="grid3" style="margin-bottom:16px">'
    // Weeks card
    +'<div class="card">'
    +'<div class="card-hd"><h3>&#128197; Hours Worked</h3><span class="card-sub">'+weeks.length+' entries &bull; '+fmt1(totalWorked)+' hrs</span></div>'
    +'<div class="weeks-wrap"><table class="weeks"><thead><tr><th>Period</th><th class="num">Hours</th><th style="width:50px"></th></tr></thead><tbody id="weeksTbody"></tbody></table></div>'
    +'<div class="add-week-form">'
    +'<input class="lbl" type="text" id="newWkLabel" placeholder="Period label">'
    +'<input class="hrs" type="number" id="newWkHrs" min="0" step="0.5" placeholder="Hrs">'
    +'<button class="btn btn-ac" id="addWkBtn">Add</button></div></div>'
    // Holiday column
    +'<div>'
    +'<div class="card"><div class="card-hd"><h3>&#127958; Holiday Balance</h3></div>'
    +'<div class="stat-block"><div class="stat-hero">'
    +'<div class="sh-hrs" style="color:'+balColor+'">'+fmt1(balance)+' hrs</div>'
    +'<div class="sh-days" style="color:'+balColor+'">'+fmt1(balance/5)+' days</div>'
    +'<div class="sh-lbl">Available Holiday</div></div>'
    +'<div class="stat-rows">'
    +'<div class="stat-row"><span class="sr-lbl">Carry-over</span><span class="sr-val ac">'+fmt1(opening)+' hrs</span></div>'
    +'<div class="stat-row"><span class="sr-lbl">Earned (8%)</span><span class="sr-val gr">+'+fmt1(earned)+' hrs</span></div>'
    +'<div class="stat-row"><span class="sr-lbl">Taken</span><span class="sr-val am">-'+fmt1(holTaken)+' hrs</span></div>'
    +'</div></div></div>'
    // Holiday log card
    +'<div class="card" style="margin-top:14px">'
    +'<div class="card-hd"><h3>&#128198; Holidays Taken</h3><span class="card-sub">'+activeYear+'</span></div>'
    +'<div class="log-list" id="holLogList"></div>'
    +'<div class="add-log-form">'
    +'<input type="date" id="holDate"><input type="number" id="holHrs" min="0" step="0.5" placeholder="Hrs" style="width:60px">'
    +'<input type="text" id="holNote" placeholder="Note"><button class="btn btn-am" id="addHolBtn">Add</button></div></div>'
    +'</div>'
    // Sick card
    +'<div class="card"><div class="card-hd"><h3>&#127973; Sick Days</h3><span class="card-sub">35 hrs/yr</span></div>'
    +'<div class="stat-block"><div class="stat-hero">'
    +'<div class="sh-hrs" style="color:'+(sickRemaining>=0?'var(--pk)':'var(--rd)')+'">'+fmt1(sickRemaining)+' hrs</div>'
    +'<div class="sh-days" style="color:'+(sickRemaining>=0?'var(--pk)':'var(--rd)')+'">'+fmt1(sickRemaining/5)+' days</div>'
    +'<div class="sh-lbl">Sick Allowance Remaining</div></div>'
    +'<div class="sick-bar-wrap"><div class="sick-bar-label"><span>'+fmt1(sickUsed)+' hrs used</span><span>'+SICK_ALLOWANCE_HRS+' hrs total</span></div>'
    +'<div class="sick-bar-track"><div class="sick-bar-fill'+(sickUsed>SICK_ALLOWANCE_HRS?' over':'')+'" style="width:'+sickPct+'%"></div></div></div>'
    +'<div class="stat-rows">'
    +'<div class="stat-row"><span class="sr-lbl">Allowance</span><span class="sr-val pk">'+SICK_ALLOWANCE_HRS+' hrs</span></div>'
    +'<div class="stat-row"><span class="sr-lbl">Used</span><span class="sr-val rd">'+fmt1(sickUsed)+' hrs</span></div>'
    +'</div></div>'
    +'<div class="log-list" id="sickLogList"></div>'
    +'<div class="add-log-form">'
    +'<input type="date" id="sickDate"><input type="number" id="sickHrs" min="0" step="0.5" placeholder="Hrs" style="width:60px">'
    +'<input type="text" id="sickNote" placeholder="Note"><button class="btn btn-pk" id="addSickBtn">Add</button></div></div>'
    +'</div>';

  // Weeks table
  const tbody=document.getElementById('weeksTbody');
  if(weeks.length){
    weeks.forEach(function(w,i){
      const tr=document.createElement('tr');
      tr.innerHTML='<td>'+w.label+'</td><td class="num" id="wkVal'+i+'">'+fmt1(w.hours)+'</td><td class="act"><button class="icon-btn" onclick="startEditWeek('+i+')">&#9998;</button></td>';
      tbody.appendChild(tr);
    });
  } else {
    tbody.innerHTML='<tr><td colspan="3" style="padding:24px;text-align:center;color:var(--tx3);font-size:.8rem">No entries yet</td></tr>';
  }

  // Holiday log
  const holListEl=document.getElementById('holLogList');
  const holFiltered=holLog.sort(function(a,b){return a.date>b.date?-1:1;});
  if(holFiltered.length){
    holFiltered.forEach(function(e){
      const d=document.createElement('div');d.className='log-item';
      d.innerHTML='<span class="log-date">'+(e.date||'')+'</span><span class="log-note">'+(e.note||'Holiday')+'</span><span class="log-hrs hol">-'+fmt1(e.hours)+' hrs</span><button class="log-del" onclick="delHol(\''+e.id+'\')">&#128465;</button>';
      holListEl.appendChild(d);
    });
  } else { holListEl.innerHTML='<div class="log-empty">No holidays logged for '+activeYear+'</div>'; }

  // Sick log
  const sickListEl=document.getElementById('sickLogList');
  const sickFiltered=sickLog.sort(function(a,b){return a.date>b.date?-1:1;});
  if(sickFiltered.length){
    sickFiltered.forEach(function(e){
      const d=document.createElement('div');d.className='log-item';
      d.innerHTML='<span class="log-date">'+(e.date||'')+'</span><span class="log-note">'+(e.note||'Sick')+'</span><span class="log-hrs sick">'+fmt1(e.hours)+' hrs</span><button class="log-del" onclick="delSick(\''+e.id+'\')">&#128465;</button>';
      sickListEl.appendChild(d);
    });
  } else { sickListEl.innerHTML='<div class="log-empty">No sick days logged for '+activeYear+'</div>'; }

  // Add week
  document.getElementById('addWkBtn').addEventListener('click',function(){
    const lbl=document.getElementById('newWkLabel').value.trim();
    const hrs=parseFloat(document.getElementById('newWkHrs').value);
    if(!lbl||isNaN(hrs)){toast('Enter a label and hours','var(--rd)');return;}
    addWeek(activeSid,activeYear,lbl,hrs);
    document.getElementById('newWkLabel').value='';document.getElementById('newWkHrs').value='';
    toast('Week added');renderAll();
  });

  // Add holiday
  document.getElementById('addHolBtn').addEventListener('click',function(){
    const date=document.getElementById('holDate').value;
    const hrs=parseFloat(document.getElementById('holHrs').value);
    const note=document.getElementById('holNote').value.trim();
    if(!date||isNaN(hrs)||hrs<=0){toast('Enter date & hours','var(--rd)');return;}
    addHolEntry(activeSid,activeYear,date,hrs,note);
    document.getElementById('holDate').value='';document.getElementById('holHrs').value='';document.getElementById('holNote').value='';
    toast('Holiday logged');renderAll();
  });

  // Add sick
  document.getElementById('addSickBtn').addEventListener('click',function(){
    const date=document.getElementById('sickDate').value;
    const hrs=parseFloat(document.getElementById('sickHrs').value);
    const note=document.getElementById('sickNote').value.trim();
    if(!date||isNaN(hrs)||hrs<=0){toast('Enter date & hours','var(--rd)');return;}
    addSickEntry(activeSid,activeYear,date,hrs,note);
    document.getElementById('sickDate').value='';document.getElementById('sickHrs').value='';document.getElementById('sickNote').value='';
    toast('Sick day logged');renderAll();
  });

  // Start date edit
  document.getElementById('startEditBtn').addEventListener('click',function(){
    const disp=document.getElementById('startDisplay');
    const inp=document.createElement('input');inp.type='date';inp.className='start-input';inp.value=staff.startDate||'';
    disp.replaceWith(inp);inp.focus();
    inp.addEventListener('blur',function(){
      if(!ov._starts) ov._starts={};
      ov._starts[activeSid]=inp.value;saveOv(ov);staff.startDate=inp.value;
      const strong=document.createElement('strong');strong.id='startDisplay';strong.textContent=inp.value||'Not set';
      inp.replaceWith(strong);
    });
  });

  // Share
  document.getElementById('shareBtn').addEventListener('click',function(){openShareModal(activeSid,activeYear);});
}

window.startEditWeek=function(idx){
  const weeks=getWeeks(activeSid,activeYear);
  const cell=document.getElementById('wkVal'+idx);
  if(!cell) return;
  const inp=document.createElement('input');inp.type='number';inp.className='edit-hrs-inp';inp.value=weeks[idx].hours;inp.min=0;inp.step=0.5;
  cell.innerHTML='';cell.appendChild(inp);inp.focus();inp.select();
  function save(){const v=parseFloat(inp.value);if(!isNaN(v)){setWeekHours(activeSid,activeYear,idx,v);toast('Hours updated');}renderAll();}
  inp.addEventListener('blur',save);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')inp.blur();if(e.key==='Escape')renderAll();});
};
window.delHol=function(id){delHolEntry(activeSid,id);toast('Entry removed');renderAll();};
window.delSick=function(id){delSickEntry(activeSid,id);toast('Entry removed');renderAll();};

function openShareModal(sid,year){
  const staff=BASE.staff.find(function(s){return s.id===sid;});
  if(!staff) return;
  const weeks=getWeeks(sid,year);
  const totalWorked=weeks.reduce(function(s,w){return s+(w.hours||0);},0);
  const earned=calcHolidays(sid,year);
  const opening=getOpening(sid,year)||0;
  const holTaken=holTakenForYear(sid,year);
  const balance=opening+earned-holTaken;
  const sickUsed=sickUsedForYear(sid,year);
  const sickRem=SICK_ALLOWANCE_HRS-sickUsed;
  const holLog=getHolLog(sid).filter(function(e){return e.year===year;}).sort(function(a,b){return a.date>b.date?-1:1;});
  const sickLog=getSickLog(sid).filter(function(e){return e.year===year;}).sort(function(a,b){return a.date>b.date?-1:1;});
  let txt='IDFL Holiday Summary - '+staff.name+' ('+year+')\n'+'='.repeat(46)+'\n\n';
  txt+='HOLIDAY BALANCE\n';
  txt+='  Carry-over:  '+fmt1(opening)+' hrs\n';
  txt+='  Earned (8%): '+fmt1(earned)+' hrs\n';
  txt+='  Taken:       '+fmt1(holTaken)+' hrs\n';
  txt+='  Balance:     '+fmt1(balance)+' hrs ('+fmt1(balance/5)+' days)\n\n';
  if(holLog.length){
    txt+='HOLIDAYS TAKEN\n';
    holLog.forEach(function(e){txt+='  '+(e.date||'')+'  '+(e.note||'Holiday')+'  '+fmt1(e.hours)+' hrs\n';});
    txt+='\n';
  }
  txt+='SICK DAYS ('+year+')\n';
  txt+='  Allowance: '+SICK_ALLOWANCE_HRS+' hrs | Used: '+fmt1(sickUsed)+' hrs | Remaining: '+fmt1(sickRem)+' hrs\n';
  if(sickLog.length){sickLog.forEach(function(e){txt+='  '+(e.date||'')+'  '+(e.note||'Sick')+'  '+fmt1(e.hours)+' hrs\n';});}
  txt+='\nHOURS WORKED\n  Total: '+fmt1(totalWorked)+' hrs across '+weeks.length+' periods\n';
  txt+='\nGenerated: '+new Date().toLocaleDateString('en-GB')+'\n';
  document.getElementById('shareOutput').textContent=txt;
  document.getElementById('shareModal').classList.remove('hidden');
}

document.getElementById('shareClose').addEventListener('click',function(){document.getElementById('shareModal').classList.add('hidden');});
document.getElementById('shareCloseBtn').addEventListener('click',function(){document.getElementById('shareModal').classList.add('hidden');});
document.getElementById('shareCopyBtn').addEventListener('click',function(){
  const txt=document.getElementById('shareOutput').textContent;
  if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){toast('Copied to clipboard');}).catch(function(){fallbackCopy(txt);});}
  else{fallbackCopy(txt);}
});
function fallbackCopy(txt){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Copied');}

document.getElementById('bulkHolBtn').addEventListener('click',function(){document.getElementById('bulkModal').classList.remove('hidden');});
document.getElementById('bulkClose').addEventListener('click',function(){document.getElementById('bulkModal').classList.add('hidden');});
document.getElementById('bulkCancelBtn').addEventListener('click',function(){document.getElementById('bulkModal').classList.add('hidden');});
document.getElementById('bulkSaveBtn').addEventListener('click',function(){
  const date=document.getElementById('bulkDate').value;
  const hrs=parseFloat(document.getElementById('bulkHrs').value);
  const note=document.getElementById('bulkNote').value.trim()||'Holiday';
  if(!date||isNaN(hrs)||hrs<=0){toast('Enter date & hours','var(--rd)');return;}
  let n=0;BASE.staff.forEach(function(s){addHolEntry(s.id,activeYear,date,hrs,note);n++;});
  document.getElementById('bulkModal').classList.add('hidden');
  document.getElementById('bulkDate').value='';document.getElementById('bulkHrs').value='';document.getElementById('bulkNote').value='';
  toast('Holiday added for '+n+' staff');renderAll();
});
document.getElementById('bulkModal').addEventListener('click',function(e){if(e.target===document.getElementById('bulkModal'))document.getElementById('bulkModal').classList.add('hidden');});
document.getElementById('shareModal').addEventListener('click',function(e){if(e.target===document.getElementById('shareModal'))document.getElementById('shareModal').classList.add('hidden');});
document.getElementById('searchBox').addEventListener('input',function(){renderSidebar();});
document.getElementById('menuBtn').addEventListener('click',function(){document.getElementById('sidebar').classList.toggle('open');});

function applyStartDates(){
  if(!ov._starts) return;
  Object.keys(ov._starts).forEach(function(sid){
    const s=BASE.staff.find(function(x){return x.id===sid;});
    if(s) s.startDate=ov._starts[sid];
  });
}

function renderAll(){renderYearTabs();renderHdrStats();renderSidebar();renderMain();}

applyStartDates();
activeYear=years[years.length-1]||'2026';
renderAll();
</script>
</body>
</html>
