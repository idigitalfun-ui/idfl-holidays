<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IDFL Staff Holidays & Hours Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090b13;--sf:#111524;--sf2:#171c30;--sf3:#1f2640;--bd:#262d4a;--bd2:#3b4673;
  --tx:#edf0ff;--tx2:#a4b1d6;--tx3:#636e94;
  --ac:#5b8ef5;--ac2:rgba(91,142,245,.14);--acg:rgba(91,142,245,.25);
  --gr:#4ade80;--gr2:rgba(74,222,128,.12);--grg:rgba(74,222,128,.22);
  --rd:#f87171;--rd2:rgba(248,113,113,.12);
  --am:#fbbf24;--am2:rgba(251,191,36,.12);
  --pu:#a78bfa;--pu2:rgba(167,139,250,.12);
  --pk:#f472b6;--pk2:rgba(244,114,182,.14);
  --shadow:0 4px 24px rgba(0,0,0,.45);--shadowL:0 20px 60px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column;font-size:14px;overflow-x:hidden}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}

/* â”€â”€ HEADER â”€â”€ */
header{background:var(--sf);border-bottom:1px solid var(--bd);padding:11px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0;box-shadow:var(--shadow);z-index:20;flex-wrap:wrap}
.logo{font-weight:900;font-size:1.15rem;letter-spacing:-.5px;display:flex;align-items:center;gap:8px;flex-shrink:0;cursor:pointer}
.logo-mark{width:30px;height:30px;background:linear-gradient(135deg,var(--ac),#8ab0ff);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.74rem;color:#fff;font-weight:900;flex-shrink:0}
.logo em{color:var(--ac);font-style:normal}
.portal-badge{background:var(--pu2);color:var(--pu);border:1px solid var(--pu);font-size:.65rem;font-weight:800;padding:2px 8px;border-radius:12px;text-transform:uppercase;letter-spacing:.5px}
.year-tabs{display:flex;background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:3px;gap:2px}
.year-tab{font-family:'Outfit',sans-serif;font-size:.78rem;font-weight:700;padding:6px 16px;border-radius:7px;border:none;background:none;color:var(--tx3);cursor:pointer;transition:all .15s}
.year-tab:hover{color:var(--tx)}
.year-tab.active{background:var(--ac);color:#fff}
.hdr-search{flex:1;max-width:240px;position:relative}
.hdr-search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--bd);border-radius:9px;background:var(--sf2);color:var(--tx);font-family:'Outfit',sans-serif;font-size:.79rem;outline:none;transition:border-color .15s}
.hdr-search input:focus{border-color:var(--ac)}
.hdr-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.4;pointer-events:none}
.hdr-stats{display:flex;gap:18px;font-size:.72rem;color:var(--tx3)}
.hdr-stats strong{color:var(--tx);font-weight:800}
.btn{font-family:'Outfit',sans-serif;font-size:.74rem;font-weight:700;padding:7px 14px;border-radius:8px;border:none;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-ac{background:var(--ac);color:#fff}.btn-ac:hover{filter:brightness(1.12)}
.btn-rd{background:var(--rd2);color:var(--rd);border:1px solid var(--rd)}.btn-rd:hover{background:var(--rd);color:#fff}
.btn-am{background:var(--am2);color:var(--am);border:1px solid var(--am)}.btn-am:hover{background:var(--am);color:#000}
.btn-gr{background:var(--gr2);color:var(--gr);border:1px solid var(--gr)}.btn-gr:hover{background:var(--gr);color:#000}
.btn-ghost{background:var(--sf2);color:var(--tx2);border:1px solid var(--bd)}.btn-ghost:hover{border-color:var(--bd2);color:var(--tx)}
.btn-pk{background:var(--pk2);color:var(--pk);border:1px solid var(--pk)}.btn-pk:hover{background:var(--pk);color:#fff}
.btn-pu{background:var(--pu2);color:var(--pu);border:1px solid var(--pu)}.btn-pu:hover{background:var(--pu);color:#fff}

/* â”€â”€ LAYOUT â”€â”€ */
.body{flex:1;display:flex;min-height:0;position:relative}
.sidebar{width:275px;flex-shrink:0;background:var(--sf);border-right:1px solid var(--bd);overflow-y:auto;padding:10px 0}
.grp-hd{font-size:.63rem;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);padding:12px 16px 6px}
.grp-hd:first-child{padding-top:4px}
.staff-item{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer;transition:background .12s;border-left:3px solid transparent}
.staff-item:hover{background:var(--sf2)}
.staff-item.active{background:var(--ac2);border-left-color:var(--ac)}
.staff-item.active .si-name{color:var(--ac)}
.si-avatar{width:32px;height:32px;border-radius:50%;background:var(--sf3);color:var(--tx2);font-size:.68rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.si-info{flex:1;min-width:0}
.si-name{font-weight:700;font-size:.81rem;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si-sub{font-size:.64rem;color:var(--tx3);margin-top:1px}
.si-badge{font-size:.62rem;font-weight:800;padding:2px 7px;border-radius:9px;flex-shrink:0;font-family:'JetBrains Mono',monospace}
.si-badge.pos{background:var(--gr2);color:var(--gr)}
.si-badge.neg{background:var(--rd2);color:var(--rd)}
.si-badge.zero{background:var(--sf3);color:var(--tx3)}
.main{flex:1;min-width:0;overflow-y:auto;padding:20px 24px}

/* â”€â”€ STAFF PORTAL (WINDOW VIEW) â”€â”€ */
.portal-container{max-width:1080px;margin:0 auto;padding:16px;width:100%}
.portal-header{background:linear-gradient(135deg,var(--sf2),var(--sf));border:1px solid var(--bd2);border-radius:18px;padding:22px 24px;margin-bottom:20px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.portal-profile{display:flex;align-items:center;gap:16px}
.portal-avatar{width:56px;height:56px;border-radius:50%;font-size:1.3rem;font-weight:900;display:flex;align-items:center;justify-content:center;color:#090b13;box-shadow:0 0 20px rgba(0,0,0,.4)}
.portal-name{font-size:1.5rem;font-weight:900;letter-spacing:-.4px;color:var(--tx)}
.portal-sub{font-size:.82rem;color:var(--tx2);margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.portal-branch{background:var(--sf3);border:1px solid var(--bd);padding:2px 10px;border-radius:20px;font-size:.72rem;font-weight:700;color:var(--ac)}

/* â”€â”€ STAT HERO CARDS (3-COLUMN) â”€â”€ */
.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr}}
.hero-card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero-card.highlight{border-color:var(--bd2);background:linear-gradient(180deg,var(--sf),var(--sf2))}
.hero-title{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);display:flex;align-items:center;gap:6px;margin-bottom:12px}
.hero-val{font-size:2.4rem;font-weight:900;line-height:1;letter-spacing:-1px}
.hero-sub{font-size:.85rem;font-weight:700;margin-top:6px;opacity:.8}
.hero-desc{font-size:.72rem;color:var(--tx3);margin-top:4px}
.hero-breakdown{margin-top:16px;border-top:1px solid var(--bd);padding-top:12px;display:flex;flex-direction:column;gap:7px;font-size:.76rem}
.hero-breakdown-row{display:flex;justify-content:space-between;color:var(--tx2)}
.hero-breakdown-row strong{font-family:'JetBrains Mono',monospace;color:var(--tx)}

/* â”€â”€ PROGRESS BARS â”€â”€ */
.progress-wrap{margin-top:14px}
.progress-track{background:var(--sf3);border-radius:6px;height:8px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;border-radius:6px;transition:width .4s ease}
.progress-fill.pk{background:var(--pk)}
.progress-fill.rd{background:var(--rd)}
.progress-fill.gr{background:var(--gr)}
.progress-labels{display:flex;justify-content:space-between;font-size:.7rem;color:var(--tx3);font-family:'JetBrains Mono',monospace}

/* â”€â”€ CONTENT GRID (2-COLUMN) â”€â”€ */
.detail-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:start}
@media(max-width:850px){.detail-grid{grid-template-columns:1fr}}

.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.card-hd{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-hd h3{font-size:.88rem;font-weight:800;display:flex;align-items:center;gap:6px}
.card-sub{font-size:.7rem;color:var(--tx3)}

/* â”€â”€ WEEKS TABLE â”€â”€ */
.weeks-wrap{max-height:480px;overflow-y:auto}
table.weeks{width:100%;border-collapse:collapse;font-size:.78rem}
table.weeks thead th{position:sticky;top:0;background:var(--sf2);color:var(--tx2);font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:8px 16px;text-align:left;border-bottom:1px solid var(--bd);z-index:2}
table.weeks thead th.num{text-align:right}
table.weeks tbody td{padding:8px 16px;border-bottom:1px solid var(--bd)}
table.weeks tbody tr:last-child td{border-bottom:none}
table.weeks tbody tr:hover td{background:var(--sf2)}
table.weeks td.num{text-align:right;font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--ac)}
table.weeks td.act{text-align:right;width:46px}
.edit-hrs-inp{width:56px;background:var(--sf2);border:1px solid var(--ac);border-radius:5px;color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:.76rem;padding:2px 5px;outline:none;text-align:right}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--tx3);padding:3px 6px;border-radius:4px;font-size:.82rem;line-height:1;transition:all .12s}
.icon-btn:hover{background:var(--sf3);color:var(--tx)}
.add-week-form{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--bd);flex-wrap:wrap;background:var(--sf2)}
.add-week-form input{background:var(--sf);border:1px solid var(--bd);border-radius:7px;color:var(--tx);font-family:'Outfit',sans-serif;font-size:.73rem;padding:6px 8px;outline:none}
.add-week-form input:focus{border-color:var(--ac)}
.add-week-form input.lbl{flex:2;min-width:140px}
.add-week-form input.hrs{width:64px}

/* â”€â”€ LOGS â”€â”€ */
.log-list{max-height:220px;overflow-y:auto}
.log-item{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--bd);font-size:.76rem}
.log-item:last-child{border-bottom:none}
.log-date{font-family:'JetBrains Mono',monospace;color:var(--tx2);min-width:80px;flex-shrink:0;font-size:.72rem}
.log-note{flex:1;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-hrs{font-weight:800;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.log-hrs.hol{color:var(--am)}.log-hrs.sick{color:var(--pk)}
.log-del{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:.85rem;padding:2px 5px;border-radius:4px;transition:all .12s}
.log-del:hover{color:var(--rd);background:var(--rd2)}
.log-empty{padding:24px 16px;text-align:center;color:var(--tx3);font-size:.75rem}
.add-log-form{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--bd);flex-wrap:wrap;background:var(--sf2)}
.add-log-form input{background:var(--sf);border:1px solid var(--bd);border-radius:7px;color:var(--tx);font-family:'Outfit',sans-serif;font-size:.73rem;padding:6px 8px;outline:none}
.add-log-form input:focus{border-color:var(--ac)}
.add-log-form input[type=date]{flex:1;min-width:110px}
.add-log-form input[type=number]{width:60px}
.add-log-form input[type=text]{flex:2;min-width:90px}

/* â”€â”€ MODALS â”€â”€ */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-bg.hidden{display:none}
.modal{background:var(--sf);border:1px solid var(--bd2);border-radius:18px;box-shadow:var(--shadowL);width:100%;max-width:520px;max-height:85vh;overflow-y:auto}
.modal-hd{padding:18px 22px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.modal-hd h2{font-size:1.05rem;font-weight:900;display:flex;align-items:center;gap:8px}
.modal-close{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:1.2rem;padding:2px 6px;border-radius:6px}
.modal-close:hover{color:var(--tx);background:var(--sf2)}
.modal-body{padding:22px}
.modal-body label{display:block;font-size:.76rem;color:var(--tx2);margin-bottom:6px;font-weight:700}
.modal-body input,.modal-body textarea{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:9px;color:var(--tx);font-family:'Outfit',sans-serif;font-size:.82rem;padding:9px 12px;outline:none;margin-bottom:14px}
.modal-body input:focus,.modal-body textarea:focus{border-color:var(--ac)}
.modal-footer{padding:14px 22px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}

/* â”€â”€ SHARE LINK BOX â”€â”€ */
.share-link-box{background:var(--sf2);border:1px solid var(--bd2);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:16px}
.share-link-input{flex:1;background:none;border:none;color:var(--ac);font-family:'JetBrains Mono',monospace;font-size:.78rem;outline:none}
.share-output{background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:14px;font-family:'JetBrains Mono',monospace;font-size:.72rem;line-height:1.65;color:var(--tx2);white-space:pre-wrap;max-height:220px;overflow-y:auto;margin-bottom:12px}

/* â”€â”€ TOAST â”€â”€ */
.toast{position:fixed;bottom:20px;right:20px;z-index:999;padding:12px 20px;border-radius:10px;font-weight:800;font-size:.78rem;background:var(--gr);color:#071a0c;box-shadow:var(--shadowL);animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* â”€â”€ MOBILE ADAPTATIONS â”€â”€ */
.menu-btn{display:none;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);width:34px;height:34px;border-radius:8px;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
@media(max-width:700px){
  .sidebar{position:fixed;left:0;top:57px;bottom:0;z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadowL)}
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:flex!important}
  header{padding:10px 14px;gap:8px}
  .main{padding:14px}
  .portal-header{padding:16px;border-radius:14px}
  .portal-name{font-size:1.25rem}
  .hero-val{font-size:2rem}
}
</style>
</head>
<body>

<header>
  <button class="menu-btn" id="menuBtn">&#9776;</button>
  <div class="logo" id="logoBtn">
    <div class="logo-mark">IF</div>
    <div>IDFL <em>Holidays</em></div>
  </div>
  <span class="portal-badge" id="portalBadge" style="display:none">Staff Portal</span>
  <div class="year-tabs" id="yearTabs"></div>
  <div class="hdr-search" id="hdrSearchWrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchBox" placeholder="Search staff or branch&hellip;">
  </div>
  <div class="hdr-stats" id="hdrStats"></div>
  <div style="margin-left:auto;display:flex;gap:8px">
    <button class="btn btn-ghost" id="adminToggleBtn" style="display:none">&#9881; Manager View</button>
    <button class="btn btn-am" id="bulkHolBtn">&#43; Holiday For All</button>
  </div>
</header>

<div class="body">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>

<!-- Bulk Holiday Modal -->
<div class="modal-bg hidden" id="bulkModal">
  <div class="modal">
    <div class="modal-hd"><h2>&#43; Add Holiday for All Staff</h2><button class="modal-close" id="bulkClose">&times;</button></div>
    <div class="modal-body">
      <label>Date</label>
      <input type="date" id="bulkDate">
      <label>Hours</label>
      <input type="number" id="bulkHrs" min="0" step="0.5" placeholder="e.g. 7">
      <label>Note / Description (e.g. Bank Holiday)</label>
      <input type="text" id="bulkNote" placeholder="Bank Holiday">
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="bulkCancelBtn">Cancel</button>
      <button class="btn btn-am" id="bulkSaveBtn">Add to All Staff</button>
    </div>
  </div>
</div>

<!-- Share Portal Link Modal -->
<div class="modal-bg hidden" id="shareModal">
  <div class="modal">
    <div class="modal-hd"><h2>&#128279; Share Staff Portal Window</h2><button class="modal-close" id="shareClose">&times;</button></div>
    <div class="modal-body">
      <p style="font-size:.78rem;color:var(--tx2);margin-bottom:12px">Staff can open this personal link anytime on their phone or PC to view their hours worked, holiday balance, and sick days:</p>
      
      <label>Personal Portal Link for Staff</label>
      <div class="share-link-box">
        <input type="text" class="share-link-input" id="shareLinkInput" readonly>
        <button class="btn btn-ac" id="shareCopyLinkBtn">&#128203; Copy Link</button>
      </div>
      
      <div style="display:flex;gap:8px;margin-bottom:16px">
        <button class="btn btn-pu" id="shareOpenWindowBtn" style="flex:1">&#128065; Preview Staff Window</button>
        <button class="btn btn-gr" id="shareWhatsAppBtn" style="flex:1">&#128241; WhatsApp Share</button>
      </div>

      <label>Text Summary Preview</label>
      <div class="share-output" id="shareOutput"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="shareCloseBtn">Close</button>
      <button class="btn btn-ghost" id="shareCopyTextBtn">&#128203; Copy Text Summary</button>
    </div>
  </div>

<script>
const SICK_ALLOWANCE_HRS = 35;
const LS_KEY = 'idfl-ov2';
const BASE = JSON.parse(document.getElementById('holiday-data').textContent);

function loadOv(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||'{}'); }catch(e){ return {}; } }
function saveOv(o){ localStorage.setItem(LS_KEY, JSON.stringify(o)); }

let ov = loadOv();
let activeSid = null;
let activeYear = '2026';
const years = ['2024', '2025', '2026'];
let isPortalMode = false;

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function fmt1(n){ return (Math.round((+n||0)*10)/10).toFixed(1); }
function fmtDays(h){ return fmt1(h/7); }
function initials(n){ return n.split(' ').map(function(p){return p[0];}).join('').toUpperCase().slice(0,2); }

function avatarColor(sid){
  const palette=['#5b8ef5','#4ade80','#fbbf24','#a78bfa','#f472b6','#f87171','#38bdf8','#f59e0b'];
  const i=parseInt(sid.replace('s',''),10)-1;
  return palette[i%palette.length];
}

function toast(msg,col){
  col=col||'var(--gr)';
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  t.style.background=col;t.style.color=(col==='var(--gr)'||col==="#4ade80")?'#071a0c':'#fff';
  document.body.appendChild(t);setTimeout(function(){t.remove();},2400);
}

// â”€â”€â”€ Data Access & Multi-Year Connection (2024 -> 2025 -> 2026) â”€â”€â”€
function getStaffWeeks(sid, year){
  const ovEntry = ((ov[year]||{})[sid])||{};
  if(ovEntry.weeks) return ovEntry.weeks;
  const base = ((BASE.years[year]||{})[sid])||{};
  return base.weeks || [];
}

function getStaffHolidayLogs(sid, year){
  const baseLogs = ((BASE.baseHolLogs||{})[sid]||[]).filter(function(e){return e.year === year;});
  const ovLogs = ((ov._holLog||{})[sid]||[]).filter(function(e){return e.year === year;});
  const ovDel = (ov._delHol||{})[sid]||[];
  const merged = baseLogs.filter(function(b){ return !ovDel.includes(b.id); }).concat(ovLogs);
  return merged;
}

function getStaffSickLogs(sid, year){
  const baseLogs = ((BASE.baseSickLogs||{})[sid]||[]).filter(function(e){return e.year === year;});
  const ovLogs = ((ov._sickLog||{})[sid]||[]).filter(function(e){return e.year === year;});
  const ovDel = (ov._delSick||{})[sid]||[];
  const merged = baseLogs.filter(function(b){ return !ovDel.includes(b.id); }).concat(ovLogs);
  return merged;
}

function computeYearStats(sid, year, prevEndingBalance){
  const weeks = getStaffWeeks(sid, year);
  const totalWorked = weeks.reduce(function(s,w){ return s + (w.hours||0); }, 0);
  const earned = Math.round(totalWorked * 0.08 * 100) / 100;
  
  let opening = 0;
  if(year === '2024'){
    const ovEntry = ((ov['2024']||{})[sid])||{};
    if(ovEntry.opening !== undefined) opening = ovEntry.opening;
    else opening = ((BASE.years['2024']||{})[sid]||{}).opening || 0;
  } else {
    opening = prevEndingBalance;
  }
  
  const holLogs = getStaffHolidayLogs(sid, year);
  const holTaken = holLogs.reduce(function(s,e){ return s + (e.hours||0); }, 0);
  
  const sickLogs = getStaffSickLogs(sid, year);
  const sickUsed = sickLogs.reduce(function(s,e){ return s + (e.hours||0); }, 0);
  const sickRemaining = SICK_ALLOWANCE_HRS - sickUsed;
  
  const balance = Math.round((opening + earned - holTaken) * 100) / 100;
  const days = balance / 7;
  
  return {
    opening: opening,
    totalWorked: totalWorked,
    earned: earned,
    holTaken: holTaken,
    balance: balance,
    days: days,
    sickUsed: sickUsed,
    sickRemaining: sickRemaining,
    holLogs: holLogs,
    sickLogs: sickLogs,
    weeks: weeks
  };
}

function getFullConnectedStats(sid){
  const y24 = computeYearStats(sid, '2024', 0);
  const y25 = computeYearStats(sid, '2025', y24.balance);
  const y26 = computeYearStats(sid, '2026', y25.balance);
  return { '2024': y24, '2025': y25, '2026': y26 };
}

// â”€â”€â”€ Mutations / Save helpers â”€â”€â”€
function ensureOvYear(year,sid){
  if(!ov[year]) ov[year]={};
  if(!ov[year][sid]) ov[year][sid]={};
}

function setWeekHours(sid,year,idx,hours){
  ensureOvYear(year,sid);
  const weeks = JSON.parse(JSON.stringify(getStaffWeeks(sid,year)));
  weeks[idx].hours = hours;
  ov[year][sid].weeks = weeks;
  saveOv(ov);
}

function addWeek(sid,year,label,hours){
  ensureOvYear(year,sid);
  const weeks = JSON.parse(JSON.stringify(getStaffWeeks(sid,year)));
  weeks.push({label:label,hours:hours,date:label});
  ov[year][sid].weeks = weeks;
  saveOv(ov);
}

function addHolEntry(sid,year,date,hours,note){
  if(!ov._holLog) ov._holLog={};
  if(!ov._holLog[sid]) ov._holLog[sid]=[];
  ov._holLog[sid].push({id:uid(),year:year,date:date,hours:hours,note:note});
  saveOv(ov);
}

function delHolEntry(sid,id){
  if(!ov._delHol) ov._delHol={};
  if(!ov._delHol[sid]) ov._delHol[sid]=[];
  ov._delHol[sid].push(id);
  if(ov._holLog&&ov._holLog[sid]){
    ov._holLog[sid]=ov._holLog[sid].filter(function(e){return e.id!==id;});
  }
  saveOv(ov);
}

function addSickEntry(sid,year,date,hours,note){
  if(!ov._sickLog) ov._sickLog={};
  if(!ov._sickLog[sid]) ov._sickLog[sid]=[];
  ov._sickLog[sid].push({id:uid(),year:year,date:date,hours:hours,note:note});
  saveOv(ov);
}

function delSickEntry(sid,id){
  if(!ov._delSick) ov._delSick={};
  if(!ov._delSick[sid]) ov._delSick[sid]=[];
  ov._delSick[sid].push(id);
  if(ov._sickLog&&ov._sickLog[sid]){
    ov._sickLog[sid]=ov._sickLog[sid].filter(function(e){return e.id!==id;});
  }
  saveOv(ov);
}

document.getElementById('shareCopyTextBtn').addEventListener('click',function(){
  const txt=document.getElementById('shareOutput').textContent;
  if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){toast('Copied summary to clipboard');}).catch(function(){fallbackCopy(txt);});}
  else{fallbackCopy(txt);}
});
function fallbackCopy(txt){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Copied');}

document.getElementById('bulkHolBtn').addEventListener('click',function(){document.getElementById('bulkModal').classList.remove('hidden');});
document.getElementById('bulkClose').addEventListener('click',function(){document.getElementById('bulkModal').classList.add('hidden');});

document.getElementById('bulkSaveBtn').addEventListener('click',function(){
  const date=document.getElementById('bulkDate').value;
  const hrs=parseFloat(document.getElementById('bulkHrs').value);
  const note=document.getElementById('bulkNote').value.trim()||'Holiday';
  if(!date||isNaN(hrs)||hrs<=0){toast('Enter date & hours','var(--rd)');return;}
  let count=0;
  BASE.staff.forEach(function(s){addHolEntry(s.id,activeYear,date,hrs,note);count++;});
  document.getElementById('bulkModal').classList.add('hidden');
  document.getElementById('bulkDate').value='';document.getElementById('bulkHrs').value='';document.getElementById('bulkNote').value='';
  toast('Added holiday for '+count+' staff');renderAll();
});

function applyStartDates(){
  if(!ov._starts) return;
  Object.keys(ov._starts).forEach(function(sid){
    const s=BASE.staff.find(function(x){return x.id===sid;});
    if(s) s.startDate=ov._starts[sid];
  });
}

function renderAll(){
  renderYearTabs();
  renderHdrStats();
  renderSidebar();
  renderMain();
}

// Check URL query params for ?staff=s2 or ?staff=Rana or ?id=s2
function checkUrlParams(){
  const params = new URLSearchParams(window.location.search);
  const staffParam = params.get('staff') || params.get('id') || params.get('name');
  if(staffParam){
    const matched = BASE.staff.find(function(s){
      return s.id.toLowerCase() === staffParam.toLowerCase() || s.name.toLowerCase().includes(staffParam.toLowerCase());
    });
    if(matched){
      activeSid = matched.id;
      isPortalMode = true;
      document.getElementById('portalBadge').style.display = 'inline-block';
      document.getElementById('hdrSearchWrap').style.display = 'none';
      document.getElementById('bulkHolBtn').style.display = 'none';
      document.getElementById('adminToggleBtn').style.display = 'inline-flex';
    }
  }
}

applyStartDates();
checkUrlParams();
if(!activeSid) activeSid = 's3'; // Default Yasir Saeed if no param
renderAll();
